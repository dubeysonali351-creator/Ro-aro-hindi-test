<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPPSC RO/ARO - विशेष्य एवं विशेषण 20 MCQs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --primary: #2563eb;
            --success: #16a34a;
            --error: #dc2626;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .quiz-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            color: var(--primary);
            font-size: 1.3rem;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #64748b;
        }

        .q-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 18px;
        }

        .q-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opt-btn {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 6px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-color);
        }

        .opt-btn:hover {
            background: #e2e8f0;
        }

        .opt-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d;
            font-weight: bold;
        }

        .opt-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #7f1d1d;
        }

        .explanation {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #f1f5f9;
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            font-size: 0.88rem;
            color: #334155;
            line-height: 1.4;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .result-box {
            display: none;
            text-align: center;
            padding: 20px;
            background: #e0f2fe;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>Target PCS 2.0 - विशेष्य एवं विशेषण</h2>
        <p>UPPSC RO/ARO Special Test (20 Questions)</p>
    </div>

    <form id="quizForm">
        <div id="questionsContainer"></div>
        <button type="button" class="submit-btn" onclick="calculateResult()">सबमिट करें और स्कोर देखें</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
const quizData = [
    { q: "1. 'ऋषि' संज्ञा शब्द से विशेषण शब्द क्या बनेगा?", a: ["आर्ष", "ऋषिकल्प", "ऋषितुल्य", "ऋषिवत्"], correct: 0, exp: "'ऋषि' संज्ञा का व्याकरणिक विशेषण रूप 'आर्ष' होता है।" },
    { q: "2. 'समुद्री साँप में घातक परंतु बहुत कीमती जहर पाया जाता है' - इस वाक्य में है:", a: ["तीन विशेषण और दो विशेष्य", "दो विशेषण और तीन विशेष्य", "दो विशेषण और दो विशेष्य", "चार विशेषण और दो विशेष्य"], correct: 0, exp: "विशेषण: समुद्री, घातक, कीमती। विशेष्य: साँप, जहर।" },
    { q: "3. 'दशरथ के प्राण राम के लिए कुल व्याकुल थे' - वाक्य में मुख्य विशेष्य है:", a: ["दशरथ", "राम", "प्राण", "व्याकुल"], correct: 2, exp: "यहाँ 'व्याकुल' विशेषण का मुख्य विशेष्य 'प्राण' है।" },
    { q: "4. निम्नलिखित में से विशेष्य पद कौन-सा है?", a: ["अनुरागी", "अनादृत", "अपमानित", "अग्नि"], correct: 3, exp: "'अग्नि' विशेष्य (संज्ञा) है, इसका विशेषण 'आग्नेय' होता है।" },
    { q: "5. 'वह श्रेष्ठ उपासक है' में विशेष्य कौन-सा है?", a: ["वह", "श्रेष्ठ", "उपासक", "है"], correct: 2, exp: "'श्रेष्ठ' विशेषण है जो 'उपासक' की विशेषता बता रहा है, अतः 'उपासक' विशेष्य है।" },
    { q: "6. 'भले और महान लोग उचित और संयमित व्यवहार करते हैं' - वाक्य में कितने विशेषण और विशेष्य हैं?", a: ["दो विशेषण और दो विशेष्य", "तीन विशेषण और दो विशेष्य", "चार विशेषण और दो विशेष्य", "चार विशेषण और तीन विशेष्य"], correct: 2, exp: "विशेषण: भले, महान, उचित, संयमित (4)। विशेष्य: लोग, व्यवहार (2)।" },
    { q: "7. 'यह गाय बहुत दूध देती है' - वाक्य में 'बहुत' विशेषण किसकी विशेषता बता रहा है?", a: ["गाय की", "दूध की", "देने की", "किसी की नहीं"], correct: 1, exp: "'बहुत' शब्द परिमाणवाचक विशेषण है जो 'दूध' की मात्रा बता रहा है।" },
    { q: "8. 'सुगंधित कस्तूरी के लोभी शिकारी अवैध हिरणों का शिकार करते हैं' - वाक्य में है:", a: ["3 विशेषण और 3 विशेष्य", "2 विशेषण और 2 विशेष्य", "4 विशेषण और 4 विशेष्य", "3 विशेषण और 4 विशेष्य"], correct: 2, exp: "विशेषण: सुगंधित, लोभी, अवैध, शिकार। विशेष्य: कस्तूरी, शिकारी, हिरणों, शिकार।" },
    { q: "9. 'बड़ा घर, छोटा बड़ा, नीला वस्त्र' में विशेष्य कौन-कौन से हैं?", a: ["घर, बड़ा, नीला", "घर, बड़ा, वस्त्र", "बड़ा, छोटा, नीला", "घर, वस्त्र"], correct: 1, exp: "घर, बड़ा (व्यक्ति/वस्तु), वस्त्र विशेष्य हैं।" },
    { q: "10. 'अत्यंत' शब्द में कौन सा विशेषण का प्रकार प्रयुक्त हुआ है?", a: ["प्रविशेषण", "विशेष्य विशेषण", "विधेय विशेषण", "संख्यावाचक"], correct: 0, exp: "जो विशेषण की भी विशेषता बताए, उसे प्रविशेषण कहते हैं।" },
    { q: "11. 'सारंग' का विशेषण रूप क्या होगा?", a: ["सारंगी", "रंगीन", "रंगीला", "सारंगयुक्त"], correct: 0, exp: "'सारंग' का विशेषण रूप सारंगी होता है।" },
    { q: "12. निम्नलिखित में से कौन-सा शब्द विशेषण है?", a: ["कुटिलता", "जटिलता", "कौटिल्य", "विद्वान"], correct: 3, exp: "'विद्वान' एक गुणवाचक विशेषण है।" },
    { q: "13. 'प्रकृति' शब्द से बनने वाला विशेषण है:", a: ["प्राकृतिक", "प्राकृत", "प्रकृतिक", "प्राकृतिकता"], correct: 0, exp: "प्रकृति + इक = प्राकृतिक।" },
    { q: "14. 'आलस्य' शब्द का विशेषण क्या होगा?", a: ["आलस", "अलस", "आलसी", "आलसीपन"], correct: 2, exp: "'आलस्य' विशेष्य (भाववाचक संज्ञा) है और 'आलसी' इसका विशेषण है।" },
    { q: "15. 'चतुर्थ' किस प्रकार का संख्यावाचक विशेषण है?", a: ["गणनावाचक", "क्रमवाचक", "आवृत्तिवाचक", "समुदायवाचक"], correct: 1, exp: "पहला, दूसरा, तीसरा, चतुर्थ आदि क्रमवाचक विशेषण हैं।" },
    { q: "16. 'लाघव' शब्द का विशेष्य रूप क्या है?", a: ["लघु", "लाघवी", "लघुता", "लाघवता"], correct: 0, exp: "'लघु' मूल विशेष्य/संज्ञा रूप है।" },
    { q: "17. 'इतिहास' शब्द का शुद्ध विशेषण रूप है:", a: ["ऐतिहासिक", "इतिहासिक", "इतिहासकार", "ऐतिहासिकता"], correct: 0, exp: "इतिहास + इक = ऐतिहासिक।" },
    { q: "18. 'नीली कमीज' में 'नीली' शब्द क्या है?", a: ["संज्ञा", "विशेषण", "विशेष्य", "क्रियाविशेषण"], correct: 1, exp: "'नीली' गुणवाचक विशेषण है।" },
    { q: "19. 'लाखों लोगों ने इसे देखा है' - वाक्य में विशेषण शब्द है:", a: ["लाखों", "लोगों", "देखा", "इसे"], correct: 0, exp: "'लाखों' अनिश्चित संख्यावाचक विशेषण है।" },
    { q: "20. 'चौगुना' किस प्रकार का संख्यावाचक विशेषण है?", a: ["क्रमवाचक", "आवृत्तिवाचक", "गणनावाचक", "समुदायवाचक"], correct: 1, exp: "दुगुना, तिगुना, चौगुना आवृत्तिवाचक विशेषण हैं।" }
];

function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = quizData.map((item, qIdx) => `
        <div class="q-card">
            <div class="q-title">${item.q}</div>
            <div class="options">
                ${item.a.map((opt, oIdx) => `
                    <button type="button" class="opt-btn" onclick="selectOption(${qIdx},${oIdx}, this)">
                        (${String.fromCharCode(97 + oIdx)})${opt}
                    </button>
                `).join('')}
            </div>
            <div class="explanation" id="exp-${qIdx}">
                <strong>व्याख्या:</strong> ${item.exp}
            </div>
        </div>
    `).join('');
}

let userAnswers = {};

function selectOption(qIdx, oIdx, btn) {
    const parent = btn.parentElement;
    const buttons = parent.querySelectorAll('.opt-btn');
    buttons.forEach(b => b.style.borderColor = '#e2e8f0');
    btn.style.borderColor = '#2563eb';
    userAnswers[qIdx] = oIdx;
}

function calculateResult() {
    let score = 0;
    quizData.forEach((item, idx) => {
        const qCard = document.querySelectorAll('.q-card')[idx];
        const buttons = qCard.querySelectorAll('.opt-btn');
        const expBox = document.getElementById(`exp-${idx}`);
        
        buttons.forEach((btn, bIdx) => {
            btn.disabled = true;
            if (bIdx === item.correct) {
                btn.classList.add('correct');
            }
            if (userAnswers[idx] === bIdx && bIdx !== item.correct) {
                btn.classList.add('wrong');
            }
        });

        if (userAnswers[idx] === item.correct) {
            score++;
        }
        expBox.style.display = 'block';
    });

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `
        <h3>परीक्षण समाप्त!</h3>
        <p style="font-size: 1.2rem; font-weight: bold;">आपका स्कोर: ${score} / ${quizData.length}</p>
        <p>${score >= 16 ? 'उत्कृष्ट प्रदर्शन! आपकी तैयारी बहुत अच्छी है।' : 'अभ्यास जारी रखें!'}</p>
    `;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

renderQuiz();
</script>

</body>
</html>
